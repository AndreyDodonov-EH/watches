; Liquid Watch firmware — Waveshare ESP32-S3-AMOLED-1.91 (SKU 28872, non-touch)
; Toolchain: PlatformIO + pioarduino platform (Arduino core 3.3.x on ESP-IDF 5.5).
; The stock `espressif32` platform tops out at Arduino core 2.x, which Waveshare's
; esp_lcd-based display driver does not support — hence pioarduino.
[env:amoled191]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3-N16R8 module: 16 MB QIO flash, 8 MB octal PSRAM
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.f_cpu = 240000000L

build_unflags = -Os
build_flags =
    -O2
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=2
    -I../spec
    -DUSB_LEFT=1

lib_deps =
    adafruit/Adafruit GFX Library @ ^1.12.1
    adafruit/Adafruit BusIO @ ^1.17.0
    h2zero/NimBLE-Arduino @ ^2.2.3

upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
